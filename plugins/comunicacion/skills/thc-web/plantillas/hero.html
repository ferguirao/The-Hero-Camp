<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plantilla · cabecera y hero THC</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Permanent+Marker&display=swap");
:root{--verde-oscuro:#003133;--lima:#98DA01;--rosa:#E83B83;--verde-fondo:#F4FAF1;--gris-claro:#C7D1CE;--blanco:#FFFFFF;--font-sans:"DM Sans",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans);background:var(--verde-fondo);color:#1C2125}
.oscuro{background:var(--verde-oscuro);color:#fff;position:relative;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:24px clamp(16px,5vw,64px)}
header nav{display:flex;gap:32px;align-items:center}
header nav a{color:#fff;text-decoration:none;font-weight:500;font-size:16px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 22px;font:500 16px/20px var(--font-sans);letter-spacing:.01em;border-radius:0;text-decoration:none}
.btn-principal{background:var(--lima);color:var(--verde-oscuro)}
.btn-secundario{border:1px solid currentColor;color:#fff}
.hero{text-align:center;padding:150px 16px 80px;max-width:720px;margin:0 auto;position:relative;z-index:1}
.hero h1{font-weight:600;font-size:clamp(40px,6vw,66px);line-height:1.12;letter-spacing:-.04em;margin:0}
.pastilla{display:inline-block;background:var(--rosa);color:#fff;border-radius:999px;padding:6px 14px 12px;transform:rotate(-1deg);box-shadow:0 5px 2.5px rgba(0,0,0,.15);line-height:.8}
.hero p{font-size:18px;line-height:28px;margin:12px 0 32px}
.botones{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.social{margin-top:48px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px;color:var(--gris-claro)}
.social b{color:#fff;font-weight:400}
.avatares{display:flex}
.avatares span{width:32px;height:32px;border-radius:999px;border:1px solid #fff;background:#9DAFA9;margin-right:-5px}
.doodle{position:absolute;opacity:.15;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.tira{display:flex;gap:24px;padding:0 0 0 24px;overflow:hidden}
.retrato{position:relative;flex:none;width:180px;height:200px}
.retrato .foto{position:absolute;inset:8px 8px 0 8px;background:#777;filter:grayscale(1);display:flex;align-items:flex-start;padding:8px;color:#fff;font-size:13px;font-weight:600}
.retrato svg{position:absolute;inset:0;width:100%;height:100%;stroke:#fff;fill:none;stroke-width:1.5}
</style>
</head>
<body>
<section class="oscuro">
  <!-- Doodles de fondo: blanco al 15 % -->

  <svg class="doodle" style="right:4%;top:200px" width="90" height="90" viewBox="0 0 90 90"><path d="M45 45 C 25 10, 5 30, 30 45 C 5 60, 25 80, 45 45 C 65 80, 85 60, 60 45 C 85 30, 65 10, 45 45 M45 45 C 50 65, 55 75, 70 85"/></svg>

  <svg class="doodle" style="right:7%;top:420px" width="100" height="60" viewBox="0 0 100 60"><path d="M10 30 C 30 10, 50 50, 70 25 C 80 12, 92 20, 90 32"/><path d="M14 46 C 34 30, 54 60, 76 40"/></svg>

    <nav>
      <a href="#">Cursos</a>
      <a href="#">Empresas</a>
      <a class="btn btn-principal" href="#">Reserva tu plaza</a>
    </nav>
  </header>

  <div class="hero">
    <h1>[Titular de una o dos líneas con una <span class="pastilla">palabra</span> destacada]</h1>
    <p>[Entradilla de una o dos líneas: qué ofreces y a quién]</p>
